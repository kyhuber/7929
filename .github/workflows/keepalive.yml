# Supabase pauses free projects after 7 days with no database activity. Pinging
# daily leaves six days of slack, which matters because GitHub delays scheduled
# runs under load and drops them outright during incidents.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.
name: Supabase keepalive

on:
  schedule:
    # 09:37 UTC — off the hour, where the scheduler queue is shortest.
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: the script is dependency-free so a broken install can't
      # be the reason the project went quiet.
      - run: node scripts/keepalive.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
